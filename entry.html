  "golden-ratio-canon": {
    slug:"golden-ratio-canon", allow:"A-09", vault:"Entry 3.2", pos:3, posName:"Wisdom",
    ratings:["S1","T2"], locks:"multi-lock (vault)", altitude:"library",
    title:"The Golden Ratio",
    hook:"The number that living plants grow by also names two things at once: God is unapproachable, and He is not far.",
    anchor:"1 Timothy 6:16 · Isaiah 57:15 · Acts 17:27–28 · Position 3 · Wisdom",
    observation:`New leaves, seeds, and florets form at a fixed angle from the last —
      about 137.5°, the golden angle, derived from φ (phi, ≈ 1.618). Fibonacci counts
      in sunflowers and pinecones approach that ratio forever and never arrive. The
      same number is enacted from inside the plant’s own growth, at every scale.`,
    body:[
      {h:"What the mathematics does", html:`
        <ol>
          <li><strong>The angle.</strong> A full circle divided so the larger arc to the
            smaller equals φ yields the golden angle. That is where each new organ
            forms when space is left most open.</li>
          <li><strong>The approach.</strong> Consecutive Fibonacci ratios (8/5, 13/8, 21/13…)
            get closer to φ at every step. No finite ratio is the number itself.</li>
          <li><strong>From within.</strong> The plant does not aim at φ from outside. The
            angle is produced by the growth process itself — the same ratio at the
            tiny apex and the finished head.</li>
        </ol>`},
      {h:"Correspondence", html:`
        <p>Paul holds both registers in one breath:</p>
        <blockquote class="ex-quote">“…who dwells in unapproachable light, whom no one
          has ever seen or can see.”
          <footer>1 Timothy 6:16</footer></blockquote>
        <p><em>Unapproachable</em> — no creaturely sequence arrives. That is the Fibonacci
          chase: best possible approximations, no arrival.</p>
        <p><em>Dwells</em> — genuine nearness. Isaiah says the same One inhabits eternity
          <em>and</em> dwells with the contrite. Acts says He is not far from each of us.
          That is φ from within: the governing ratio is not a distant target; the
          creature lives by it.</p>
        <p>The public claim is correspondence of mechanism, not a proof from botany.
          The 66-book map of the lamp is a different filing (Entry 4.4). This page is
          not that map.</p>`},
      {h:"What to do next (free)", html:`
        <ol>
          <li>Walk <a href="branch.html#/3">Position 3 · Wisdom</a> for sibling signs (harmonics, pairing).</li>
          <li>Hold the same two-register claim at the fire: <a href="entry.html#/fire">seven properties</a>.</li>
          <li>The lamp itself is the Library’s coordinate system, not this number:
            <a href="menorah.html">open the lamp</a>.</li>
        </ol>`},
    ],
    precision:`S1 on the mathematics and the two-register reading of 1 Timothy 6:16;
      T2 on how far phyllotaxis may be pressed as a full lock-table of aseity. Fibonacci
      ratios never equal φ. Not every spiral in nature is the golden angle. φ is not a
      charm, a sales pitch, or a substitute for Scripture. Occult “sacred geometry”
      that treats the ratio as a power to be used is refused. This summary is not the
      Menorah canon map.`,
    doxology:"No sequence captures Him. He is not far from any of us.",
    exhibit:"",
    branch:"branch.html#/3",
    related:[{href:"entry.html#/harmonics",label:"Harmonic series"},{href:"entry.html#/menorah-pairing",label:"Menorah pairing"},{href:"menorah.html",label:"The Lamp"}],
  },

  cellcycle: {
    slug:"cellcycle", allow:"A-19", vault:"Entry 2.21", pos:2, posName:"Knowledge",
    ratings:["S1"], locks:"Architecture B", altitude:"general",
    title:"The Cell That Rests",
    hook:"Every cell in your body runs six phases of work — then enters a finished seventh. The same architecture as the week God blessed and made holy.",
    anchor:"Genesis 2:2–3 · Isaiah 6:3 · Position 2 · Knowledge · cell biology",
    observation:`The cell cycle is six mechanistically real, sequentially necessary phases
      (G1, S, G2, Prophase, Metaphase, Anaphase/Telophase) terminating in G0 — the
      quiescent state where the fully differentiated cell performs its highest
      designed purpose. The same six-plus-terminal-seventh architecture as the
      creation week, at the molecular floor.`,
    body:[
      {h:"The mechanism — six phases, then rest", html:`
        <ol>
          <li><strong>G1.</strong> The cell grows, synthesizes proteins, and assesses readiness.</li>
          <li><strong>S.</strong> The entire genome is precisely duplicated.</li>
          <li><strong>G2.</strong> The copy is verified before release.</li>
          <li><strong>Prophase.</strong> The duplicated inheritance is ordered for separation.</li>
          <li><strong>Metaphase.</strong> Chromosomes align at the equator with mathematical precision.</li>
          <li><strong>Anaphase/Telophase.</strong> The work is finished; two daughter cells emerge.</li>
        </ol>
        <p>Then the seventh: <strong>G0</strong> — not death, not dormancy. The neuron fires,
          the heart cell contracts, the red blood cell carries oxygen. The cell has
          become most fully what it was always being made to be.</p>`},
      {h:"Correspondence", html:`
        <p>Genesis 2:3 says God blessed the seventh day and <em>made it holy</em> —
          the first thing in all of Scripture called holy is a unit of time.</p>
        <blockquote class="ex-quote">“So God blessed the seventh day and made it holy,
          because on it God rested from all his work that he had done in creation.”
          <footer>Genesis 2:3</footer></blockquote>
        <p>Six phases of labor, then a categorically distinct seventh — at every scale
          of creaturely time: the week, the agricultural year, the Shemitah, the
          Jubilee, the feasts, and the cell cycle. The same architecture, from the
          division of a single cell to the sweep of the redemptive calendar.</p>`},
      {h:"How to hold the claim", html:`
        <ol>
          <li>The biology is real biology — a cell cannot skip S phase and still divide; G0 is a documented physiological state.</li>
          <li>The correspondence is architectural (six-plus-terminal-seventh), not a claim that each phase maps to a creation day, nor that the cell worships.</li>
          <li>Even the refusal of the seventh is written into biology as pathology: the cell that will not enter G0 is what the body calls malignant.</li>
        </ol>`},
    ],
    precision:`Structural correspondence, not hidden prophecy: six genuine sequential phases
      and a qualitatively distinct seventh — stated exactly as far as the architecture reaches.`,
    doxology:"The first thing called holy in Scripture is a unit of time — and your cells keep it.",
    exhibit:"",
    branch:"branch.html#/2",
    related:[{href:"index.html#/sign/embryology",label:"Embryology exhibit (eighth day)"},{href:"branch.html#/3",label:"Wisdom"},{href:"care/welcome.html",label:"Care"}],
  },

  silence: {
    slug:"silence", allow:"A-20", vault:"CDP-I", pos:5, posName:"Understanding",
    ratings:["S1"], locks:"Node Principle", altitude:"general",
    title:"Load-Bearing Silence",
    hook:"The pattern does not form where the sound is loudest. It forms at the nodes — the points of stillness.",
    anchor:"Genesis 1:2 · Isaiah 6 · Position 5 · Understanding · the still point",
    observation:`A physicist draws a bow across a metal plate dusted with sand: the grains
      scatter, then at a new frequency assemble into a precise geometric pattern —
      at the nodes, the points of stillness, not where the sound shouts. The same
      frequency that organizes sand shatters a wine glass at its resonant point.
      Matter gathers where the sound rests.`,
    body:[
      {h:"The mechanism — pattern at the node", html:`
        <p>In every vibrating system there are points that remain still while the
          rest moves: the <strong>nodes</strong>. Sand on a Chladni plate gathers
          exactly there — the pattern is not drawn by the loudest motion but by
          the places motion cancels.</p>
        <p>Genesis 1:2 stands on this threshold: darkness, the deep, and the
          Spirit hovering — before the first word. The sequence is invariant
          across Scripture: order → chaos → new order. Four hundred silent years
          between Malachi and Matthew — the old pattern dispersed, then a
          genealogy that reorganizes the same names into something the old order
          could never have produced from within itself.</p>`},
      {h:"Correspondence", html:`
        <blockquote class="ex-quote">“The earth was without form and void, and
          darkness was over the face of the deep. And the Spirit of God was
          hovering over the face of the waters.”
          <footer>Genesis 1:2</footer></blockquote>
        <p>He is the supreme Node: the cross is history's greatest dissolution;
          the sealed tomb is the silence between frequencies; the resurrection is
          the new pattern forming at the still point. What survives is not what
          is loudest — it is what can be reorganized.</p>`},
      {h:"How to hold the claim", html:`
        <ol>
          <li>The physics is real physics — Chladni nodal patterns are a documented phenomenon, and the wine-glass resonance is mainstream acoustics.</li>
          <li>The correspondence is structural (pattern from stillness), not a claim that biblical silence is a literal vibration.</li>
          <li>This is why the site keeps the claim descriptive: pattern at the nodes — no sound-healing or occult freight.</li>
        </ol>`},
    ],
    precision:`Structural correspondence: pattern forms at stillness. Stated as far as the
      acoustics reaches and no further — no mystical vibration claims.`,
    doxology:"Matter gathers where the sound rests — and the Spirit hovers before the Word speaks.",
    exhibit:"",
    branch:"branch.html#/5",
    related:[{href:"branch.html#/2",label:"Knowledge (cymactics)"},{href:"index.html#/sign/cymatics",label:"Cymatics exhibit"},{href:"care/welcome.html",label:"Care"}],
  },

  patternrising: {
    slug:"patternrising", allow:"A-21", vault:"CDP-III", pos:7, posName:"Might",
    ratings:["S1"], locks:"Eschatological Frequency", altitude:"general",
    title:"The Pattern Still Rising",
    hook:"The old pattern does not slowly improve — it dissolves, and a different pattern assembles with sudden precision.",
    anchor:"Revelation 21:1–5 · 2 Corinthians 5:17 · Position 7 · Might · new creation",
    observation:`Watch a cymatics plate when the frequency shifts: the old pattern dissolves
      into apparent chaos, then — at the new frequency fully established — a
      different pattern assembles with sudden precision, more intricate than the
      last. John sees the end: the first heaven and earth pass away, and the One
      on the throne says, “Behold, I am making all things new.”`,
    body:[
      {h:"The mechanism — dissolution, then assembly", html:`
        <p>Greek has two words for "new": <em>νέος</em> (new in time, a renovated
          version) and <em>καινός</em> (new in kind, a different sort of thing
          altogether). John does not reach for <em>νέος</em>.</p>
        <blockquote class="ex-quote">“Then I saw a new heaven and a new earth…
          And he who was seated on the throne said, ‘Behold, I am making all
          things new.’”
          <footer>Revelation 21:1, 5</footer></blockquote>
        <p>Not renovating the old. Not evolving it. Dissolving it and assembling
          what was always the higher frequency. Across the ages, beauty and
          order intensify; creation's groaning is not despair but the medium
          waiting for the next frequency.</p>`},
      {h:"Correspondence", html:`
        <p>He is the Logos: the first pattern was spoken through Him, the last
          will be spoken through Him. “I am making all things new” is the same
          voice that said <em>Let there be light</em> — now declaring the
          eschatological frequency from the throne.</p>
        <p>At the cross, the old pattern was dissolved. In the resurrection, the
          new pattern assembled — the first fruits of the new creation, already
          rising. What began at the empty tomb will complete at the throne.</p>`},
      {h:"How to hold the claim", html:`
        <ol>
          <li>The cymatics observation is real physics; the dissolution→assembly pattern is descriptive.</li>
          <li>The correspondence is structural (old dissolves, new assembles in kind), not a claim that heaven is literally a higher vibration.</li>
          <li>Paul names the same grammar: “If anyone is in Christ, he is a new creation” — καινή κτίσις, new in kind.</li>
        </ol>`},
    ],
    precision:`Structural correspondence, not physics-as-theology: the old dissolves and a
      new-in-kind assembles — stated as far as the pattern reaches.`,
    doxology:"The God who spoke the first pattern is still speaking the last — and the last was never a renovation.",
    exhibit:"",
    branch:"branch.html#/7",
    related:[{href:"branch.html#/5",label:"Understanding (silence)"},{href:"index.html#/verdict/0",label:"The Verdict"},{href:"care/welcome.html",label:"Care"}],
  },

  blankcenter: {
    slug:"blankcenter", allow:"A-22", vault:"CDP-VI", pos:4, posName:"Shamash",
    ratings:["S1"], locks:"Blank as Sign", altitude:"general",
    title:"What God Omitted",
    hook:"Six stations stand visible; the seventh is missing — and its vacancy is shaped with such precision that only a living Presence can occupy it.",
    anchor:"Exodus 25:8–9 · Job 1:21 · John 3 · Position 4 · Shamash · the empty center",
    observation:`God hands Moses a pattern from above — every lampstand, every loop, every
      veil. But trace the furniture of the Holy Place: the lampstand south, the
      showbread north, the incense altar west — and the center, conspicuously,
      deliberately empty. What God left out is also revelation. The blank is not
      absence of design; it is a second mode of speaking.`,
    body:[
      {h:"The mechanism — the shaped vacancy", html:`
        <p>Six stations stand visible; the seventh is missing. Its vacancy is
          shaped with such precision that only a living Presence can occupy it —
          never an object. The same shaped emptiness appears in the grammar
          itself: Job says he will return <em>there</em> (Job 1:21) — a blank
          left exactly where a name should stand. Jesus tells Nicodemus he must
          be born <em>ἄνωθεν</em> — one Greek word meaning both "again" and
          "from above," and the text never tells you which He intends.</p>
        <blockquote class="ex-quote">“According to all that I show you, according
          to the pattern of the tabernacle… so you shall make it.”
          <footer>Exodus 25:9</footer></blockquote>
        <p>The ambiguity is not translator's imprecision. It is the sign itself —
          a slot left deliberately open, shaped for exactly one answer no reader
          can supply alone.</p>`},
      {h:"Correspondence", html:`
        <p>When you balance the six stations around the missing point, they form
          a symmetric cross — the north-south axis of table and lampstand crossed
          by the east-west axis of the incense altar and the missing station. The
          Holy Place is a cross waiting for its center.</p>
        <p>In the fullness of time, God moved into the blank: the Word became
          flesh and tabernacled among us. What the pattern could not contain,
          the Pattern-Maker himself became.</p>`},
      {h:"How to hold the claim", html:`
        <ol>
          <li>The six-station geometry of the Holy Place is textually grounded; the cross-axis observation is a geometric reading, stated as such.</li>
          <li>The blank-as-sign is an interpretive key, not a claim that the furniture was physically rearranged.</li>
          <li>It reaches as far as the architecture reaches: a shaped emptiness, filled by the Word made flesh.</li>
        </ol>`},
    ],
    precision:`Geometric and grammatical observation, not blueprint archaeology: a shaped
      vacancy that only a living Presence can fill — stated as far as the text reaches.`,
    doxology:"What the pattern could not contain, the Pattern-Maker himself became.",
    exhibit:"",
    branch:"branch.html#/4",
    related:[{href:"index.html#/sign/fire",label:"Fire exhibit (Shamash)"},{href:"index.html#/sign/embryology",label:"Embryology exhibit (eighth day)"},{href:"care/welcome.html",label:"Care"}],
  },
};

const ORDER = [
  "conscience","snowflake","triplepoint","spectrum","harmonics","fire","cymatics",
  "menorah-pairing","golden-ratio-canon","aaronic-blessing","psalm-19",
  "binah-sight","counsel","might","cellcycle","silence","patternrising","blankcenter",
];

function chips(ratings){
  return (ratings||[]).map(r => {
    const cls = String(r).toLowerCase().startsWith("s") ? "rating-s1" : "rating-t1";
    return `<span class="rating-chip ${cls}">${r}</span>`;
  }).join("");
}

function renderIndex(){
  document.title = "Entries · Creation Semiotics Library";
  const groups = {
    "Position 1 · Fear": ["conscience"],
    "Position 2 · Knowledge": ["snowflake","triplepoint","spectrum","cymatics","cellcycle"],
    "Position 3 · Wisdom": ["harmonics","menorah-pairing","golden-ratio-canon"],
    "Position 4 · Shamash": ["fire","aaronic-blessing","psalm-19","blankcenter"],
    "Position 5 · Understanding": ["binah-sight","silence"],
    "Position 6 · Counsel": ["counsel"],
    "Position 7 · Might": ["might","patternrising"],
  };
  let html = `
    <p class="crumb"><a href="menorah.html">Lamp</a> · Public entries</p>
    <div class="entry-head">
      <h1>Public entry summaries</h1>
      <p class="index-lead">Allowlisted cards you can read without the private vault.
        Each page states observation, correspondence, and a precision note.
        Full multi-lock filings stay owner-side. Interactive free exhibits remain on
        <a href="index.html#/sign">The Signs</a>.</p>
    </div>
    <div class="entry-index">`;
  for(const [label, slugs] of Object.entries(groups)){
    html += `<div class="index-group">${label}</div>`;
    for(const slug of slugs){
      const e = ENTRIES[slug];
      if(!e) continue;
      html += `<a class="index-card" href="#/${slug}">
        <div class="id">${e.vault} · ${e.allow}</div>
        <h2>${e.title}</h2>
        <p>${e.hook}</p>
      </a>`;
    }
  }
  html += `</div>
    <p class="notice">Default deny still governs the corpus. If it is not on this list,
      it is not a public entry — only a private filing or an unpressed observation.</p>`;
  document.getElementById("mount").innerHTML = html;
}

function renderEntry(slug){
  const e = ENTRIES[slug];
  if(!e){
    document.getElementById("mount").innerHTML = `
      <p class="crumb"><a href="entry.html">Entries</a></p>
      <h1>Not on the public allowlist</h1>
      <p class="entry-hook">No public summary is published for <code>${slug}</code>.
        Return to the <a href="entry.html">entry index</a> or the <a href="menorah.html">lamp</a>.</p>`;
    return;
  }
  document.title = `${e.title} · Entries`;
  const sections = (e.body||[]).map(s => `
    <section class="section">
      <h2>${s.h}</h2>
      ${s.html}
    </section>`).join("");
  const related = (e.related||[]).map(r =>
    `<a class="btn btn-ghost" href="${r.href}">${r.label}</a>`).join("");
  document.getElementById("mount").innerHTML = `
    <p class="crumb">
      <a href="entry.html">Entries</a> ·
      <a href="${e.branch}">Pos ${e.pos} ${e.posName}</a>
    </p>
    <header class="entry-head">
      <div class="entry-meta-row">
        ${chips(e.ratings)}
        ${e.locks ? `<span class="lock-chip">${e.locks}</span>` : ""}
        <span class="pos-chip">${e.vault} · ${e.allow} · ${e.altitude}</span>
      </div>
      <h1>${e.title}</h1>
      <p class="entry-hook">${e.hook}</p>
      <p class="entry-anchor">${e.anchor}</p>
    </header>
    <section class="section">
      <h2>Observation</h2>
      <p>${e.observation}</p>
    </section>
    ${sections}
    <section class="section">
      <div class="precision-box">
        <h2>Precision note</h2>
        <p>${e.precision}</p>
      </div>
    </section>
    <p class="doxology">${e.doxology}</p>
    <div class="reader-cta">
      ${e.exhibit ? `<a class="btn btn-primary" href="${e.exhibit}">Open free exhibit</a>` : ""}
      <a class="btn btn-ghost" href="${e.branch}">Branch Pos ${e.pos}</a>
      <a class="btn btn-ghost" href="entry.html">All public entries</a>
      ${related}
    </div>
    <p class="notice">Summary only. Filing, locks, and ratings remain governed in the vault.
      See the publish allowlist for what may ship.</p>`;
  window.scrollTo({top:0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
}

function route(){
  const h = location.hash || "#/";
  const m = h.match(/^#\/([a-z0-9-]+)/i);
  if(m && m[1]) renderEntry(m[1].toLowerCase());
  else renderIndex();
}

addEventListener("hashchange", route);
route();
</script>
</body>
</html>
